<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>train spike</title>
  <style>
    html, body { margin: 0; height: 100%; background: #121212; overflow: hidden; }
    .gif { position: fixed; pointer-events: none; object-fit: cover; border-radius: 8px; }
  </style>
  <script>
    window.bridgeT0 = performance.now();
    // Всё, что Compose не умеет сам: браузерные API, gif поверх canvas.
    // Kotlin читает состояние строкой через status() — без колбэков через границу Wasm.
    window.bridge = (() => {
      const st = { wake: 'выкл', lock: '?', redirect: '—', gif: '—', sw: '—', online: navigator.onLine ? 'да' : 'нет', input: '—' };

      // Какую клавиатуру просит Compose: скрытое поле появляется только при вводе с касания.
      new MutationObserver(ms => ms.forEach(m => {
        const e = m.target;
        if (e.tagName === 'INPUT' || e.tagName === 'TEXTAREA') {
          st.input = e.tagName.toLowerCase() + ' inputmode=' + e.getAttribute('inputmode') + ' type=' + e.getAttribute('type');
        }
      })).observe(document.documentElement, { attributes: true, subtree: true, attributeFilter: ['inputmode', 'type'] });
      let wakeLock = null;
      const gifs = {};

      addEventListener('online', () => st.online = 'да');
      addEventListener('offline', () => st.online = 'нет');

      async function wake() {
        if (!('wakeLock' in navigator)) { st.wake = 'API нет (не secure context?)'; return; }
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          st.wake = 'держит экран';
          wakeLock.addEventListener('release', () => st.wake = 'отпущен');
        } catch (e) { st.wake = 'ошибка: ' + e.name; }
      }
      // Wake lock отпускается, когда вкладка уходит в фон, — берём заново при возврате.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && wakeLock !== null) wake();
      });

      function lock() {
        if (!('locks' in navigator)) { st.lock = 'API нет'; return; }
        navigator.locks.request('active-workout', { ifAvailable: true }, l => {
          if (!l) { st.lock = 'открыто в другой вкладке'; return; }
          st.lock = 'лок у этой вкладки';
          return new Promise(() => {}); // держим, пока вкладка жива
        });
      }

      async function testRedirect() {
        try {
          const r = await fetch('/redirect', { redirect: 'manual' });
          st.redirect = 'fetch: type=' + r.type + ' status=' + r.status;
        } catch (e) { st.redirect = 'fetch: ошибка ' + e.name; }
      }

      async function showGif(id, url, key, x, y, w, h) {
        let g = gifs[id];
        if (!g) {
          g = gifs[id] = { el: document.createElement('img') };
          g.el.className = 'gif';
          document.body.appendChild(g.el);
          try {
            const r = await fetch(url, { headers: { 'X-Api-Key': key } });
            if (!r.ok) { st.gif = 'HTTP ' + r.status; return; }
            g.el.src = URL.createObjectURL(await r.blob());
            st.gif = 'blob: загружен';
          } catch (e) { st.gif = 'ошибка ' + e.name; }
        }
        Object.assign(g.el.style, { display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      }

      function hideGif(id) { if (gifs[id]) gifs[id].el.style.display = 'none'; }

      function cacheLoaded() {
        if (!navigator.serviceWorker) return;
        navigator.serviceWorker.ready.then(reg => {
          const urls = performance.getEntriesByType('resource').map(e => e.name)
            .filter(u => u.startsWith(location.origin) && !u.includes('/media/'));
          reg.active.postMessage({ cache: [location.origin + '/', ...urls] });
        });
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => st.sw = navigator.serviceWorker.controller ? 'управляет страницей' : 'установлен')
          .catch(e => st.sw = 'ошибка: ' + e.name);
      } else st.sw = 'API нет (не secure context?)';

      return {
        status: () => JSON.stringify(st),
        wake, lock, testRedirect, showGif, hideGif, cacheLoaded,
        sinceStart: () => performance.now() - window.bridgeT0,
      };
    })();
  </script>
</head>
<body>
  <script src="spike.js"></script>
</body>
</html>
