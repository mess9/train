<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- без viewport-fit=cover: в установленном приложении верх уходил под строку состояния, «Назад» не нажать -->
  <meta name="theme-color" content="#0F1012">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>Тренировки</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F1012; overflow: hidden; }
    .gif { position: fixed; pointer-events: none; object-fit: contain; background: #F2F2F0; border-radius: 12px; display: none; }
  </style>
  <script>
    // Всё, что Compose не умеет сам: замок вкладки, wake lock, гифка поверх canvas, service worker.
    // Kotlin вызывает функции window.bridge и читает строки — без колбэков через границу Wasm.
    // Compose для KeyboardType.Number ставит скрытому полю inputmode="number" — такого значения нет,
    // и телефон открывает буквенную клавиатуру. Правим на "numeric" до старта приложения
    (() => {
      const fix = (n, v) => (String(n).toLowerCase() === 'inputmode' && v === 'number') ? 'numeric' : v;
      const set = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (n, v) { return set.call(this, n, fix(n, v)); };
      const d = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'inputMode');
      if (d && d.set) Object.defineProperty(HTMLElement.prototype, 'inputMode', {
        ...d, set(v) { d.set.call(this, fix('inputmode', v)); },
      });
    })();

    window.bridge = (() => {
      // Ключ из ссылки `#key=…` — в localStorage, из адресной строки убрать
      const m = location.hash.match(/[#&]key=([^&]+)/);
      if (m) {
        try { localStorage.setItem('key', decodeURIComponent(m[1])); } catch (e) {}
        history.replaceState(null, '', location.pathname + location.search);
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
      }

      // Wake lock отпускается, когда вкладка уходит в фон, — берём заново при возврате
      let wakeWanted = false, wakeLock = null;
      async function requestWake() {
        if (!wakeWanted || wakeLock || !('wakeLock' in navigator)) return;
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => wakeLock = null);
        } catch (e) {}
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestWake();
      });
      function wake(on) {
        wakeWanted = on;
        if (on) requestWake();
        else if (wakeLock) { wakeLock.release(); wakeLock = null; }
      }

      // Гифки: <img> с blob-адресом поверх canvas, положение задаёт Compose
      const gifs = {};
      function showGif(id, url, key, x, y, w, h) {
        let g = gifs[id];
        if (!g) {
          g = gifs[id] = document.createElement('img');
          g.className = 'gif';
          document.body.appendChild(g);
          fetch(url, { headers: { 'X-Api-Key': key } })
            .then(r => r.ok ? r.blob() : null)
            .then(b => { if (b && gifs[id] === g) g.src = URL.createObjectURL(b); })
            .catch(() => {});
        }
        Object.assign(g.style, { display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      }
      function hideGif(id) {
        const g = gifs[id];
        if (!g) return;
        if (g.src) URL.revokeObjectURL(g.src);
        g.remove();
        delete gifs[id];
      }

      // Звук конца отдыха. Браузер даёт играть звук только после жеста пользователя: контекст
      // создаём и будим на первом касании, а сигнал потом звучит и без касания
      let audio = null;
      function unlockAudio() {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
        } catch (e) {}
      }
      ['pointerdown', 'touchend', 'keydown'].forEach(t => window.addEventListener(t, unlockAudio, { capture: true, passive: true }));
      function beep() {
        if (!audio) return;
        try {
          if (audio.state === 'suspended') audio.resume();
          const t0 = audio.currentTime;
          [0, 0.3].forEach(d => { // два коротких писка, как вибрация 200-100-200
            const o = audio.createOscillator(), g = audio.createGain();
            o.type = 'sine';
            o.frequency.value = 880;
            g.gain.setValueAtTime(0.0001, t0 + d);
            g.gain.exponentialRampToValueAtTime(0.4, t0 + d + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.2);
            o.connect(g).connect(audio.destination);
            o.start(t0 + d);
            o.stop(t0 + d + 0.22);
          });
        } catch (e) {}
      }

      return { lock: '?', wake, showGif, hideGif, beep };
    })();

    // Замок «одна вкладка — одна активная тренировка» берётся до старта приложения:
    // вторая вкладка показывает заглушку и ничего не пишет в localStorage (ADR 0007).
    // Ждём пару секунд, а не ifAvailable: при перезагрузке старый документ отпускает замок не мгновенно
    (async () => {
      window.bridge.lock = await new Promise(resolve => {
        if (!navigator.locks) { resolve('held'); return; }
        navigator.locks.request('active-workout', { signal: AbortSignal.timeout(2000) }, () => {
          resolve('held');
          return new Promise(() => {}); // держим, пока вкладка жива
        }).catch(() => resolve('busy'));
      });
      const s = document.createElement('script');
      const src = 'app.js'; // server:appDist подставляет имя с хешем — это и есть версия приложения
      window.bridge.build = (src.match(/^app\.(\w+)\.js$/) || [])[1] || 'dev';
      s.src = src;
      document.body.appendChild(s);
    })();
  </script>
</head>
<body>
</body>
</html>
