<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- без viewport-fit=cover: в установленном приложении верх уходил под строку состояния, «Назад» не нажать -->
  <meta name="theme-color" content="#0F1012">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>Тренировки</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F1012; overflow: hidden; }
    /* Жесты целиком у Compose: он сам листает по pointer-событиям. Его canvas разрешает браузеру
       pan-x pan-y, и Chrome на Android, пока карточку тащат, сдвигал и пружинил всю страницу.
       touch-action берётся пересечением с предками — запрет на body действует и на canvas */
    html, body { touch-action: none; overscroll-behavior: none; }
    .gif { position: fixed; pointer-events: none; object-fit: contain; background: #F2F2F0; border-radius: 12px; display: none; }
  </style>
  <script>
    // Всё, что Compose не умеет сам: замок вкладки, wake lock, гифка поверх canvas, service worker.
    // Kotlin вызывает функции window.bridge и читает строки — без колбэков через границу Wasm.
    // Compose для KeyboardType.Number ставит скрытому полю inputmode="number" — такого значения нет,
    // и телефон открывает буквенную клавиатуру. Правим на "numeric" до старта приложения
    (() => {
      const fix = (n, v) => (String(n).toLowerCase() === 'inputmode' && v === 'number') ? 'numeric' : v;
      const set = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (n, v) { return set.call(this, n, fix(n, v)); };
      const d = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'inputMode');
      if (d && d.set) Object.defineProperty(HTMLElement.prototype, 'inputMode', {
        ...d, set(v) { d.set.call(this, fix('inputmode', v)); },
      });
    })();

    window.bridge = (() => {
      // Ключ из ссылки `#key=…` — в localStorage, из адресной строки убрать
      const m = location.hash.match(/[#&]key=([^&]+)/);
      if (m) {
        try { localStorage.setItem('key', decodeURIComponent(m[1])); } catch (e) {}
        history.replaceState(null, '', location.pathname + location.search);
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
      }

      // Wake lock отпускается, когда вкладка уходит в фон, — берём заново при возврате
      let wakeWanted = false, wakeLock = null;
      async function requestWake() {
        if (!wakeWanted || wakeLock || !('wakeLock' in navigator)) return;
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => wakeLock = null);
        } catch (e) {}
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestWake();
      });
      function wake(on) {
        wakeWanted = on;
        if (on) requestWake();
        else if (wakeLock) { wakeLock.release(); wakeLock = null; }
      }

      // Гифки: <img> с blob-адресом поверх canvas, положение задаёт Compose
      const gifs = {};
      function showGif(id, url, key, x, y, w, h) {
        let g = gifs[id];
        if (!g) {
          g = gifs[id] = document.createElement('img');
          g.className = 'gif';
          document.body.appendChild(g);
          fetch(url, { headers: { 'X-Api-Key': key } })
            .then(r => r.ok ? r.blob() : null)
            .then(b => { if (b && gifs[id] === g) g.src = URL.createObjectURL(b); })
            .catch(() => {});
        }
        Object.assign(g.style, { display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      }
      function hideGif(id) {
        const g = gifs[id];
        if (!g) return;
        if (g.src) URL.revokeObjectURL(g.src);
        g.remove();
        delete gifs[id];
      }

      // Звук конца отдыха. Браузер даёт играть звук только после жеста пользователя: контекст
      // создаём и будим на первом касании, а сигнал потом звучит и без касания
      let audio = null;
      function unlockAudio() {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
        } catch (e) {}
      }
      ['pointerdown', 'touchend', 'keydown'].forEach(t => window.addEventListener(t, unlockAudio, { capture: true, passive: true }));
      function beep() {
        if (!audio) return;
        try {
          if (audio.state === 'suspended') audio.resume();
          const t0 = audio.currentTime;
          [0, 0.3].forEach(d => { // два коротких писка, как вибрация 200-100-200
            const o = audio.createOscillator(), g = audio.createGain();
            o.type = 'sine';
            o.frequency.value = 880;
            g.gain.setValueAtTime(0.0001, t0 + d);
            g.gain.exponentialRampToValueAtTime(0.4, t0 + d + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.2);
            o.connect(g).connect(audio.destination);
            o.start(t0 + d);
            o.stop(t0 + d + 0.22);
          });
        } catch (e) {}
      }

      // Экранная клавиатура: сколько CSS-пикселей снизу она закрывает. Kotlin опрашивает и поднимает
      // экран на эту высоту — поле поиска и список над клавиатурой. Меньше 80 — панели браузера, не она
      function keyboard() {
        const vv = window.visualViewport;
        if (!vv) return 0;
        const h = Math.round(window.innerHeight - vv.height - vv.offsetTop);
        return h >= 80 ? h : 0;
      }

      // Фото прогресса: <input type=file> — камера (capture) или галерея телефона. Сжимаем здесь же:
      // длинная сторона до 2000 px, JPEG 0.85 — снимок в 4–12 МБ становится 300–900 КБ, лимит
      // сервера 15 МБ. Kotlin опрашивает bridge.photo: picking → busy → ready | error | none
      let photo = { state: 'none' };
      function pickPhoto(camera) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        if (camera) input.capture = 'environment';
        photo = { state: 'picking' };
        input.addEventListener('cancel', () => { if (photo.state === 'picking') photo = { state: 'none' }; });
        input.addEventListener('change', () => {
          const f = input.files && input.files[0];
          if (f) usePhoto(f, camera); else photo = { state: 'none' };
        });
        input.click();
      }
      async function usePhoto(f, camera) {
        photo = { state: 'busy' };
        try {
          // Из галереи — дата файла: снято раньше, чем выбрано. С камеры — сейчас
          photo = { state: 'ready', ...(await compress(f)), takenAt: camera ? Date.now() : (f.lastModified || Date.now()) };
        } catch (e) {
          photo = { state: 'error', message: String((e && e.message) || e) };
        }
      }
      async function compress(f) {
        const MAX = 2000;
        let bmp;
        try {
          bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
        } catch (e) {
          // Формат, который браузер не рисует (HEIC в Chrome), — как есть: сервер его примет
          if (f.size > 15 * 1024 * 1024) throw new Error('файл больше 15 МБ');
          return { data: await base64(f), type: f.type || 'image/heic' };
        }
        const k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
        const c = document.createElement('canvas');
        c.width = Math.round(bmp.width * k);
        c.height = Math.round(bmp.height * k);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        if (bmp.close) bmp.close();
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
        if (!blob) throw new Error('не удалось сжать фото');
        return { data: await base64(blob), type: 'image/jpeg' };
      }
      function base64(blob) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(String(r.result).split(',')[1] || '');
          r.onerror = () => reject(r.error);
          r.readAsDataURL(blob);
        });
      }
      function photoReset() { photo = { state: 'none' }; }

      // Дата задним числом: системный выбор даты телефона. Kotlin забирает выбранное takeDate()
      let date = '';
      function pickDate(current, max) {
        const i = document.createElement('input');
        i.type = 'date';
        i.value = current;
        if (max) i.max = max;
        Object.assign(i.style, { position: 'fixed', left: '50%', top: '40%', width: '1px', height: '1px', opacity: '0' });
        document.body.appendChild(i);
        i.addEventListener('change', () => { if (i.value) date = i.value; i.remove(); });
        i.addEventListener('blur', () => setTimeout(() => i.remove(), 1000));
        try { i.showPicker(); } catch (e) { i.focus(); i.click(); }
      }
      function takeDate() { const d = date; date = ''; return d; }

      return {
        lock: '?', wake, showGif, hideGif, beep, keyboard,
        pickPhoto, usePhoto, photoReset, get photo() { return photo; }, pickDate, takeDate,
      };
    })();

    // Замок «одна вкладка — одна активная тренировка» берётся до старта приложения:
    // вторая вкладка показывает заглушку и ничего не пишет в localStorage (ADR 0007).
    // Ждём пару секунд, а не ifAvailable: при перезагрузке старый документ отпускает замок не мгновенно
    (async () => {
      window.bridge.lock = await new Promise(resolve => {
        if (!navigator.locks) { resolve('held'); return; }
        navigator.locks.request('active-workout', { signal: AbortSignal.timeout(2000) }, () => {
          resolve('held');
          return new Promise(() => {}); // держим, пока вкладка жива
        }).catch(() => resolve('busy'));
      });
      const s = document.createElement('script');
      const src = 'app.js'; // server:appDist подставляет имя с хешем — это и есть версия приложения
      window.bridge.build = (src.match(/^app\.(\w+)\.js$/) || [])[1] || 'dev';
      s.src = src;
      document.body.appendChild(s);
      // То же на самом canvas: у прокручиваемого предка браузер мог бы вернуть себе pan, и
      // пересечения с body тогда не хватит. Compose ставит своё и меняет canvas уже после старта —
      // следим за всем его shadow root
      const lockCanvas = () => {
        const host = [...document.body.querySelectorAll('div')].find(d => d.shadowRoot);
        if (!host) return false;
        const lock = () => host.shadowRoot.querySelectorAll('canvas').forEach(cv => {
          if (cv.style.touchAction !== 'none') cv.style.touchAction = 'none';
        });
        lock();
        new MutationObserver(lock).observe(host.shadowRoot, { subtree: true, childList: true, attributes: true, attributeFilter: ['style'] });
        return true;
      };
      const waitHost = new MutationObserver(() => { if (lockCanvas()) waitHost.disconnect(); });
      waitHost.observe(document.body, { subtree: true, childList: true });
    })();
  </script>
</head>
<body>
</body>
</html>
