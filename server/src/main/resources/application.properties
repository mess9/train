quarkus.application.name=train
quarkus.http.port=${PORT:7313}
# В тестах — любой свободный порт
quarkus.http.test-port=0

# В dev и тестах Postgres поднимают Dev Services (нужен Docker); в проде адрес и пароль —
# из окружения: QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.flyway.migrate-at-start=true

# Wasm приложения весит ~11 МБ — без сжатия долгий первый запуск
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/html,text/css,text/javascript,application/javascript,application/json,application/wasm,application/manifest+json

# JSON как в core (TrainJson): неизвестные поля пропускаются, null не пишутся
quarkus.kotlin-serialization.json.ignore-unknown-keys=true
quarkus.kotlin-serialization.json.explicit-nulls=false
quarkus.kotlin-serialization.json.encode-defaults=true

# Первый пользователь и ключ: TRAIN_BOOTSTRAP_EMAIL, TRAIN_BOOTSTRAP_KEY. Повторный старт ничего не дублирует
%dev.train.bootstrap.email=dev@local
%dev.train.bootstrap.key=dev-key

# exercises-dataset: TRAIN_SOURCE_PATH — exercises.json, TRAIN_MEDIA_PATH — папка с images/ и videos/
%dev.train.source.path=../../exercises-dataset/data/exercises.json
%dev.train.media.path=../../exercises-dataset
%test.train.source.path=src/test/resources/dataset/exercises.json
%test.train.media.path=src/test/resources/dataset

# Фото прогресса (ADR 0010): TRAIN_PHOTOS_PATH — папка на диске, пишется сервером.
# Не задана — API фото отвечает 503. Предел файла — TRAIN_PHOTOS_MAX_BYTES, по умолчанию 15 МБ
%dev.train.photos.path=build/photos
%test.train.photos.path=build/test-photos
train.photos.max-bytes=15728640
%test.train.photos.max-bytes=1048576
# Тело запроса: фото до предела выше, с запасом
quarkus.http.limits.max-body-size=20M

# Версия — TRAIN_VERSION из core (gradle.properties). Сборка образа задаёт TRAIN_COMMIT — короткий
# хеш коммита — и TRAIN_BUILD — номер сборки Jenkins (ADR 0009)

# «Сегодня» для статуса плана и границы дней в фильтрах; по умолчанию — пояс системы
# train.zone=Europe/Moscow
