quarkus.application.name=train
quarkus.http.port=${PORT:7313}
# В тестах — любой свободный порт
quarkus.http.test-port=0

# В dev и тестах Postgres поднимают Dev Services (нужен Docker); в проде адрес и пароль —
# из окружения: QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.flyway.migrate-at-start=true

# Wasm приложения весит ~11 МБ — без сжатия долгий первый запуск
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/html,text/css,text/javascript,application/javascript,application/json,application/wasm,application/manifest+json
